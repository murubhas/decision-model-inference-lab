apiVersion: batch/v1
kind: Job
metadata:
  name: decision-inference-benchmark-repro3
  namespace: model-serving
  labels:
    app.kubernetes.io/name: decision-inference-benchmark
    app.kubernetes.io/component: benchmark
    app.kubernetes.io/part-of: decision-model-inference-lab
    benchmark-run: repro3
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-inference-benchmark
        app.kubernetes.io/component: benchmark
        app.kubernetes.io/part-of: decision-model-inference-lab
        benchmark-run: repro3
    spec:
      restartPolicy: Never
      serviceAccountName: decision-inference-agent
      nodeSelector:
        role: inference-system
      securityContext:
        runAsNonRoot: true
        fsGroup: 185
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark
          image: ${BENCHMARK_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - --mode=RUN
            - --corpus=/work/datasets/guardrail-corpus.v1.jsonl
            - --pricing=/work/pricing/provider-pricing.g5-spot-use2a-2026-10-01.json
            - --observations=/work/results/benchmark-observations.jsonl
            - --report=/work/results/benchmark-report.json
            - --paths=LLM,JEV,HYBRID,DECIDER,HYBRID_DECIDER
            - --warmups=1
            - --repetitions=3
            - --allow-paid-provider-calls
            - --allow-draft-labels
          envFrom:
            - configMapRef:
                name: decision-inference-agent-config
            - secretRef:
                name: decision-inference-agent-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: results
              mountPath: /work/results
            - name: pricing
              mountPath: /work/pricing
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: decision-inference-benchmark-repro3-results
        - name: pricing
          configMap:
            name: decision-inference-benchmark-repro3-pricing
            items:
              - key: provider-pricing.g5-spot-use2a-2026-10-01.json
                path: provider-pricing.g5-spot-use2a-2026-10-01.json
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
