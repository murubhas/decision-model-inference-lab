apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-inference-agent
  namespace: model-serving
  labels:
    app.kubernetes.io/name: decision-inference-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: decision-model-inference-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-inference-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-inference-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: decision-model-inference-lab
    spec:
      serviceAccountName: decision-inference-agent
      nodeSelector:
        role: inference-system
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ${AGENT_IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: decision-inference-agent-config
            - secretRef:
                name: decision-inference-agent-secret
          env:
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: decision-inference-agent-secret
                  key: MCP_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
