apiVersion: v1
kind: Pod
metadata:
  name: decision-inference-benchmark-repro3-reader
  namespace: model-serving
  labels:
    app.kubernetes.io/name: decision-inference-benchmark
    app.kubernetes.io/component: benchmark-results-reader
    app.kubernetes.io/part-of: decision-model-inference-lab
    benchmark-run: repro3
spec:
  restartPolicy: Never
  nodeSelector:
    role: inference-system
  securityContext:
    runAsNonRoot: true
    fsGroup: 185
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: ${BENCHMARK_IMAGE}
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: results
          mountPath: /work/results
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: decision-inference-benchmark-repro3-results
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
