apiVersion: v1
kind: ConfigMap
metadata:
  name: decision-inference-agent-config
  namespace: model-serving
  labels:
    app.kubernetes.io/name: decision-inference-agent
    app.kubernetes.io/part-of: decision-model-inference-lab
data:
  GUARDRAIL_SEMANTIC_MODE: HYBRID
  GUARDRAIL_ENFORCEMENT: SHADOW
  GUARDRAIL_HYBRID_AVAILABILITY_POLICY: FALLBACK_TO_LLM
  BEDROCK_GUARDRAIL_MODEL_ID: global.anthropic.claude-sonnet-5-5
  BEDROCK_RECOMMENDATION_MODEL_ID: global.anthropic.claude-sonnet-5-5
  BEDROCK_AWS_REGION: us-east-2
  BEDROCK_ENDPOINT_OVERRIDE: "${BEDROCK_ENDPOINT_OVERRIDE}"
  TYPESAFE_BASE_URL: https://api.typesafe.ai
  TYPESAFE_MODEL: jev-latest
  STRANDS_DECIDER_BASE_URL: http://strands-decider.model-serving.svc.cluster.local:8000
  STRANDS_DECIDER_MODEL: StrandsAgents/strands-decider-2B-hobson-v19
  RECOMMENDATION_ENABLED: "true"
  APP_MCP_URL: "${APP_MCP_URL}"
  OIDC_AUTH_SERVER_URL: "${OIDC_AUTH_SERVER_URL}"
  OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
  A2A_PUBLIC_URL: http://decision-inference-agent.model-serving.svc.cluster.local:8080
  OTEL_SERVICE_NAME: decision-inference-agent
  OTEL_TRACES_SAMPLER_ARG: "0.10"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317
