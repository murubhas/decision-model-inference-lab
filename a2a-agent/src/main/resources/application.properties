quarkus.rest-client.typesafe.url=${TYPESAFE_BASE_URL:https://api.typesafe.ai}
quarkus.rest-client.typesafe.connect-timeout=2000
quarkus.rest-client.typesafe.read-timeout=5000

typesafe.model=${TYPESAFE_MODEL:jev-latest}

quarkus.rest-client.strands-decider.url=${STRANDS_DECIDER_BASE_URL:http://localhost:8000}
quarkus.rest-client.strands-decider.connect-timeout=2000
quarkus.rest-client.strands-decider.read-timeout=15000
strands-decider.model=${STRANDS_DECIDER_MODEL:StrandsAgents/strands-decider-2B-hobson-v19}

guardrail.semantic.mode=${GUARDRAIL_SEMANTIC_MODE:HYBRID}
guardrail.semantic.enabled=${GUARDRAIL_SEMANTIC_ENABLED:true}
guardrail.enforcement=${GUARDRAIL_ENFORCEMENT:SHADOW}
guardrail.hybrid.noul-clear-low=${GUARDRAIL_HYBRID_NOUL_CLEAR_LOW:0.20}
guardrail.hybrid.noul-clear-high=${GUARDRAIL_HYBRID_NOUL_CLEAR_HIGH:0.80}
guardrail.hybrid.minimum-distribution-confidence=${GUARDRAIL_HYBRID_MINIMUM_CONFIDENCE:0.65}
guardrail.hybrid.availability-policy=${GUARDRAIL_HYBRID_AVAILABILITY_POLICY:FALLBACK_TO_LLM}
guardrail.input.prompt-injection-escalate-threshold=${GUARDRAIL_INPUT_INJECTION_ESCALATE_THRESHOLD:0.35}
guardrail.input.prompt-injection-block-threshold=${GUARDRAIL_INPUT_INJECTION_BLOCK_THRESHOLD:0.80}
guardrail.input.in-scope-block-threshold=${GUARDRAIL_INPUT_SCOPE_BLOCK_THRESHOLD:0.20}
guardrail.input.in-scope-allow-threshold=${GUARDRAIL_INPUT_SCOPE_ALLOW_THRESHOLD:0.80}
guardrail.output.risk-escalate-threshold=${GUARDRAIL_OUTPUT_RISK_ESCALATE_THRESHOLD:0.35}
guardrail.output.risk-block-threshold=${GUARDRAIL_OUTPUT_RISK_BLOCK_THRESHOLD:0.80}
guardrail.output.positive-block-threshold=${GUARDRAIL_OUTPUT_POSITIVE_BLOCK_THRESHOLD:0.20}
guardrail.output.positive-allow-threshold=${GUARDRAIL_OUTPUT_POSITIVE_ALLOW_THRESHOLD:0.80}
guardrail.tool.positive-block-threshold=${GUARDRAIL_TOOL_POSITIVE_BLOCK_THRESHOLD:0.20}
guardrail.tool.positive-allow-threshold=${GUARDRAIL_TOOL_POSITIVE_ALLOW_THRESHOLD:0.80}

guardrail.llm.model-id=${BEDROCK_GUARDRAIL_MODEL_ID:global.anthropic.claude-sonnet-5-5}
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.model-id=${guardrail.llm.model-id}
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.max-tokens=${BEDROCK_GUARDRAIL_MAX_TOKENS:2048}
quarkus.langchain4j.bedrock.guardrail-judge.aws.region=${BEDROCK_AWS_REGION:us-east-2}
quarkus.langchain4j.bedrock.guardrail-judge.aws.endpoint-override=${BEDROCK_ENDPOINT_OVERRIDE:}
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.client.timeout=30s
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.aws.api-call-timeout=30s
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.log-requests=false
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.log-responses=false
quarkus.langchain4j.bedrock.guardrail-judge.chat-model.log-body=false

recommendation.model-id=${BEDROCK_RECOMMENDATION_MODEL_ID:global.anthropic.claude-sonnet-5-5}
recommendation.enabled=${RECOMMENDATION_ENABLED:true}
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.model-id=${recommendation.model-id}
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.max-tokens=${BEDROCK_RECOMMENDATION_MAX_TOKENS:2048}
quarkus.langchain4j.bedrock.recommendation-agent.aws.region=${BEDROCK_AWS_REGION:us-east-2}
quarkus.langchain4j.bedrock.recommendation-agent.aws.endpoint-override=${BEDROCK_ENDPOINT_OVERRIDE:}
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.client.timeout=120s
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.aws.api-call-timeout=120s
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.log-requests=false
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.log-responses=false
quarkus.langchain4j.bedrock.recommendation-agent.chat-model.log-body=false

app.mcp.url=${APP_MCP_URL:http://localhost:8081/mcp}
quarkus.langchain4j.mcp.generate-tool-provider=false
quarkus.langchain4j.mcp."compute-tools".transport-type=streamable-http
quarkus.langchain4j.mcp."compute-tools".url=${app.mcp.url}
quarkus.langchain4j.mcp."compute-tools".protocol-version=2026-07-28
quarkus.langchain4j.mcp."compute-tools".tool-execution-timeout=120s
quarkus.langchain4j.mcp."compute-tools".log-requests=false
quarkus.langchain4j.mcp."compute-tools".log-responses=false

quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/decision-model-lab}
quarkus.oidc-client.client-id=${OIDC_CLIENT_ID:decision-inference-agent}
quarkus.oidc-client.credentials.secret=${MCP_CLIENT_SECRET:not-configured}
quarkus.oidc-client.grant.type=client

# The exporter and sampler type are Quarkus build-time settings. Package a
# ratio sampler and tune only its argument at runtime: 0.0 locally, a reviewed
# non-zero ratio in EKS.
quarkus.otel.traces.exporter=cdi
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.0}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

app.a2a.protocol=JSONRPC
app.a2a.public-url=${A2A_PUBLIC_URL:http://localhost:8080}

# This local experiment has no inbound identity provider yet. Production must
# replace this with an authenticated A2A deployment rather than inheriting it.
a2a.authorization.required=false

# Quarkus tests prove the A2A boundary with separately unit-tested in-memory
# providers. This prevents default test and packaged-test runs from spending
# provider credits or depending on external availability.
%test.guardrail.semantic.enabled=false
%test.recommendation.enabled=false
%test.quarkus.otel.enabled=false
%test.quarkus.log.category."io.opentelemetry.usage".level=ERROR
